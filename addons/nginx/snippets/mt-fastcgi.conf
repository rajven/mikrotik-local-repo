include fastcgi_params;
fastcgi_pass unix:/run/php/php-fpm.sock;
fastcgi_connect_timeout 2s;
fastcgi_send_timeout    3s;
# No fastcgi_read_timeout here: the PHP endpoints enforce their own upstream
# timeouts (connect 2 s / total 3 s in mt_proxy_config.php), and a global 3 s
# read timeout used to kill ros-warmup.php, which walks the whole device DB
# and legitimately runs for minutes (see the warm-up location in site.conf).
fastcgi_buffer_size     16k;
fastcgi_buffers         8 16k;
fastcgi_busy_buffers_size 32k;
fastcgi_buffering on;
gzip off;
