        # ============================================================
        # MikroTik upgrade script
        # ============================================================

        # Полный запрет прямого доступа к каталогу mt-proxy/.
        location ^~ /mt-proxy/ {
            return 404;
        }

        # ------------------------------------------------------------
        # RouterOS v6: /routeros/NEWEST6.*, /routeros/NEWESTa6.*
        # ------------------------------------------------------------
        location ~ ^/routeros/(NEWEST6\.stable|NEWESTa6\.stable|NEWEST6\.long-term|NEWESTa6\.long-term|NEWEST6\.upgrade|NEWESTa6\.upgrade)$ {
            include /etc/nginx/snippets/mt-fastcgi.conf;
            fastcgi_param SCRIPT_FILENAME /var/www/html/mt-proxy/ros6-upgrade.php;
            fastcgi_param SCRIPT_NAME     /ros6-upgrade.php;
            fastcgi_param DOCUMENT_ROOT   /var/www/html;
            fastcgi_param REQUEST_URI     $request_uri;
            fastcgi_param QUERY_STRING    $query_string;
        }

        # ------------------------------------------------------------
        # RouterOS v7: /routeros/NEWEST7.*, /routeros/NEWESTa7.*
        # ------------------------------------------------------------
        location ~ ^/routeros/(NEWEST7\.stable|NEWESTa7\.stable|NEWEST7\.long-term|NEWESTa7\.long-term|NEWEST7\.upgrade|NEWESTa7\.upgrade)$ {
            include /etc/nginx/snippets/mt-fastcgi.conf;
            fastcgi_param SCRIPT_FILENAME /var/www/html/mt-proxy/ros7-upgrade.php;
            fastcgi_param SCRIPT_NAME     /ros7-upgrade.php;
            fastcgi_param DOCUMENT_ROOT   /var/www/html;
            fastcgi_param REQUEST_URI     $request_uri;
            fastcgi_param QUERY_STRING    $query_string;
        }

        # ------------------------------------------------------------
        # Разрешение автоматического обновления
        # ------------------------------------------------------------
        location = /routeros/force_update.php {
            include /etc/nginx/snippets/mt-fastcgi.conf;
            fastcgi_param SCRIPT_FILENAME /var/www/html/mt-proxy/force_update.php;
            fastcgi_param SCRIPT_NAME     /force_update.php;
            fastcgi_param DOCUMENT_ROOT   /var/www/html;
            fastcgi_param REQUEST_URI     $request_uri;
            fastcgi_param QUERY_STRING    $query_string;
        }
