server {

        listen 80;

        server_name download.mikrotik.com upgrade.mikrotik.com;

        root /var/www/html;

        server_name_in_redirect on;

        error_page   500 502 503 504  /50x.html;

        location = /50x.html {
                root   /usr/share/nginx/html;
        }

        # ============================================================
        # MikroTik upgrade script
        # ============================================================

        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Deny access to databases and backups inside the project
        location ~* ^/mt-proxy/.*\.(db|sqlite|sqlite3|db-journal|db-wal|db-shm|sql)$ {
            deny all;
            return 404;
        }

        # Deny access to git, env files, logs, and Composer files inside the project
        location ~* ^/mt-proxy/(\.git|\.env|composer\.(json|lock)|.*\.log) {
            deny all;
            return 404;
        }

        location ~* ^/routeros/.*\.(rsc|txt)$ {
            if ($allowed_routeros_ua = 0) {
                return 403;
            }
        }

        location /mt-proxy/ {
            auth_basic "Restricted Access";
            auth_basic_user_file /etc/nginx/.htpasswd;
            try_files $uri $uri/ /mt-proxy/index.php?$query_string;
            location ~ \.php$ {
                include snippets/fastcgi-php.conf;
                fastcgi_pass unix:/run/php/php-fpm.sock;
                fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
                fastcgi_param REMOTE_ADDR $remote_addr;
                fastcgi_read_timeout 300;
            }
        }

        # ------------------------------------------------------------
        # RouterOS v6: /routeros/NEWEST6.*, /routeros/NEWESTa6.*
        # ------------------------------------------------------------
        location ~ ^/routeros/(NEWEST6\.stable|NEWESTa6\.stable|NEWEST6\.long-term|NEWESTa6\.long-term|NEWEST6\.upgrade|NEWESTa6\.upgrade)$ {
            include /etc/nginx/snippets/mt-fastcgi.conf;
            fastcgi_param SCRIPT_FILENAME /var/www/html/mt-proxy/ros6-upgrade.php;
            fastcgi_param SCRIPT_NAME     /ros6-upgrade.php;
            fastcgi_param DOCUMENT_ROOT   /var/www/html;
            fastcgi_param REQUEST_URI     $request_uri;
            fastcgi_param QUERY_STRING    $query_string;
        }

        # ------------------------------------------------------------
        # RouterOS v7: /routeros/NEWEST7.*, /routeros/NEWESTa7.*
        # ------------------------------------------------------------
        location ~ ^/routeros/(NEWEST7\.stable|NEWESTa7\.stable|NEWEST7\.long-term|NEWESTa7\.long-term|NEWEST7\.upgrade|NEWESTa7\.upgrade)$ {
            include /etc/nginx/snippets/mt-fastcgi.conf;
            fastcgi_param SCRIPT_FILENAME /var/www/html/mt-proxy/ros7-upgrade.php;
            fastcgi_param SCRIPT_NAME     /ros7-upgrade.php;
            fastcgi_param DOCUMENT_ROOT   /var/www/html;
            fastcgi_param REQUEST_URI     $request_uri;
            fastcgi_param QUERY_STRING    $query_string;
        }

        # ------------------------------------------------------------
        # Allow automatic upgrades
        # ------------------------------------------------------------
        location = /routeros/force_update.php {
            include /etc/nginx/snippets/mt-fastcgi.conf;
            fastcgi_param SCRIPT_FILENAME /var/www/html/mt-proxy/force_update.php;
            fastcgi_param SCRIPT_NAME     /force_update.php;
            fastcgi_param DOCUMENT_ROOT   /var/www/html;
            fastcgi_param REQUEST_URI     $request_uri;
            fastcgi_param QUERY_STRING    $query_string;
        }

        # ------------------------------------------------------------
        # Cache warm-up
        # ------------------------------------------------------------
        location = /routeros/ros-warmup.php {
            include /etc/nginx/snippets/mt-fastcgi.conf;
            fastcgi_param SCRIPT_FILENAME /var/www/html/mt-proxy/ros-warmup.php;
            fastcgi_param SCRIPT_NAME     /ros-warmup.php;
            fastcgi_param DOCUMENT_ROOT   /var/www/html;
            fastcgi_param REQUEST_URI     $request_uri;
            fastcgi_param QUERY_STRING    $query_string;
        }

        access_log /var/log/nginx/mirror-access.log;
        error_log  /var/log/nginx/mirror-error.log;

}
