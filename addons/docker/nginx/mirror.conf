        # ============================================================
        # MikroTik upgrade script
        # ============================================================

        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Закрыть доступ к БД и бэкапам внутри проекта
        location ~* ^/mt-proxy/.*\.(db|sqlite|sqlite3|db-journal|db-wal|db-shm|sql)$ {
            deny all;
            return 404;
        }

        # Закрыть git, env, логи, composer внутри проекта
        location ~* ^/mt-proxy/(\.git|\.env|composer\.(json|lock)|.*\.log) {
            deny all;
            return 404;
        }

        # ------------------------------------------------------------
        # /mt-proxy/ -> http://127.0.0.1:8080
        # ------------------------------------------------------------
        location /mt-proxy/ {
            proxy_pass http://127.0.0.1:8080;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
#            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header User-Agent        $http_user_agent;

            # Таймауты (в исходнике был fastcgi_read_timeout 300)
            proxy_connect_timeout 10s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;
        }

        # ------------------------------------------------------------
        # /routeros/ -> http://127.0.0.1:8080
        # ------------------------------------------------------------
        location /routeros/ {
            proxy_pass http://127.0.0.1:8080;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
#            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header User-Agent        $http_user_agent;

            proxy_connect_timeout 10s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;
        }

        location / {
            limit_rate_after 100m;
            limit_rate       50M;
            autoindex on;
        }
