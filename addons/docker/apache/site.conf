    # ---------------------------------------------------------------------------
    # Deny access to hidden files/directories (.git, .env, etc.)
    # ----------------------------------------------------------------------------
    <LocationMatch "/\.">
        Require all denied
    </LocationMatch>

    # ----------------------------------------------------------------------------
    # Deny access to databases and backups within the project
    # ----------------------------------------------------------------------------
    <LocationMatch "^/mt-proxy/.*\.(db|sqlite|sqlite3|db-journal|db-wal|db-shm|sql)$">
        Require all denied
    </LocationMatch>

    # ------------------------------------------------------------
    # Close git, env, logs, and composer within the project
    # ------------------------------------------------------------
    <LocationMatch "^/mt-proxy/(\.git|\.env|composer\.(json|lock)|.*\.log)">
        Require all denied
    </LocationMatch>

    # ----------------------------------------------------------------------------
    # Proxying /mt-proxy/ -> http://127.0.0.1:8080
    # ----------------------------------------------------------------------------
    <Location "/mt-proxy/">
        ProxyPreserveHost On
        ProxyPass "http://127.0.0.1:8080/mt-proxy/"
        ProxyPassReverse "http://127.0.0.1:8080/mt-proxy/"

        RequestHeader set X-Real-IP "%{REMOTE_ADDR}s"
        RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}s"
        RequestHeader set X-Forwarded-Proto "%{REQUEST_SCHEME}s"

    </Location>

    # --------------------------------------------------------------
    # Proxying /routeros/ -> http://127.0.0.1:8080
    # --------------------------------------------------------------
    <Location "/routeros/"> 
        ProxyPreserveHost On 
        ProxyPass "http://127.0.0.1:8080/routeros/" 
        ProxyPassReverse "http://127.0.0.1:8080/routeros/" 

        RequestHeader set X-Real-IP "%{REMOTE_ADDR}s" 
        RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}s" 
        RequestHeader set X-Forwarded-Proto "%{REQUEST_SCHEME}s" 

    </Location>

    # ------------------------------------------------------------
    # Directory listing (similar to autoindex on)
    # ------------------------------------------------------------
    <Directory "/var/www/html/routeros">
        Options +Indexes
        IndexOptions FancyIndexing HTMLTable NameWidth=*
        AllowOverride None
        Require all granted
    </Directory>
