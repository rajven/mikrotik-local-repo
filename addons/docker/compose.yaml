# mikrotik-local-repo — all-in-one
#
# Run from the docker/ directory of the cloned repo:
#   cp .env.example .env   # then edit it
#   docker compose up -d --build
#
# Build context is the repo root (..), the Dockerfile is docker/Dockerfile.

name: mikrotik-local-repo

services:
  mirror:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: mikrotik-local-repo:docker
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      TZ: ${TZ:-UTC}
      SITE_URL: ${SITE_URL:-http://localhost}
      WARMUP_TOKEN: ${WARMUP_TOKEN:?set WARMUP_TOKEN in .env}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      # --- LDAP auth for the admin UI (optional): MT_LDAP_AUTH=1 switches the
      # Basic Auth backend from /data/config/.htpasswd to the directory.
      # Required with MT_LDAP_AUTH=1: MT_LDAP_URL, MT_LDAP_BASE_DN.
      # See the "LDAP-авторизация" section of docker/README.md.
      MT_LDAP_AUTH: ${MT_LDAP_AUTH:-0}
      MT_LDAP_URL: ${MT_LDAP_URL:-}
      MT_LDAP_BIND_DN: ${MT_LDAP_BIND_DN:-}
      MT_LDAP_BIND_PASSWORD: ${MT_LDAP_BIND_PASSWORD:-}
      MT_LDAP_BASE_DN: ${MT_LDAP_BASE_DN:-}
      # Unset -> the script's own default "(uid=?)"; a value without "?" would
      # make mt-auth-backend.sh fail the config check and kill lighttpd.
      MT_LDAP_FILTER: ${MT_LDAP_FILTER:-}
      MT_LDAP_STARTTLS: ${MT_LDAP_STARTTLS:-0}
      # Native group restriction (0005): group DN (or DNs joined with '|').
      # Membership is checked by mod_authn_ldap itself — (member=<user DN>)
      # searched with the group DN as the base; set MT_LDAP_GROUP_MEMBER=
      # "memberUid" for posixGroup entries. Leave unset for valid-user.
      MT_LDAP_REQUIRE_GROUP: ${MT_LDAP_REQUIRE_GROUP:-}
      MT_LDAP_GROUP_MEMBER: ${MT_LDAP_GROUP_MEMBER:-}
      # CA certificate (path inside the container, e.g. /data/config/ldap-ca.pem
      # from the data volume) and TLS_REQCERT for /etc/ldap/ldap.conf — these two
      # are consumed by the entrypoint, not by mt-auth-backend.sh.
      MT_LDAP_CA_CERT: ${MT_LDAP_CA_CERT:-}
      MT_LDAP_TLS_REQCERT: ${MT_LDAP_TLS_REQCERT:-}
      SYNC_INTERVAL_HOURS: ${SYNC_INTERVAL_HOURS:-3}
      SYNC_START_DELAY: ${SYNC_START_DELAY:-90}
    volumes:
      # Host directory for all state (mirror, DB, config). Set MIRROR_DATA_DIR
      # in .env; relative paths resolve against this compose file's dir.
      # Bind mount (default below) => rsync/tar/rsnap-friendly on the host.
      - ${MIRROR_DATA_DIR:-./data}:/data
      # Named volume instead (drop the bind line above, then the bottom
      # `volumes:` block matters again):
      # - mirror-data:/data
    # For the air-gapped LAN scenario host networking avoids any NAT hairpin
    # surprises when devices point their static DNS at this host:
    # network_mode: "host"   # and remove the ports: mapping

volumes:
  mirror-data:   # used only with the named-volume variant

# First start with an empty bind dir: the entrypoint seeds /data itself and
# chowns /data/{routeros,state,config} to www-data (uid 33 on Debian).
# On the host these dirs will be owned by uid 33 — that is expected.
