# ============================================================
# Automatic PHP detection: FPM (Unix socket) or mod_php
# Include before vhosts (a2enconf php-autodetect)
# ============================================================

# --- 1. Look for an FPM socket
<IfFile /run/php/php-fpm.sock>
    Define FPM_SOCKET /run/php/php-fpm.sock
</IfFile>
<IfFile /run/php/php8.3-fpm.sock>
    Define FPM_SOCKET /run/php/php8.3-fpm.sock
</IfFile>

# --- 2. FPM mode: socket found + mod_proxy_fcgi enabled
<IfDefine FPM_SOCKET>
    <IfModule mod_proxy_fcgi.c>
        Define PHP_MODE_FPM 1
    </IfModule>
</IfDefine>

# --- 3. Fallback: mod_php (if FPM is not selected)
<IfDefine !PHP_MODE_FPM>
    <IfModule mod_php.c>
        Define PHP_MODE_MODPHP 1
    </IfModule>
    <IfModule mod_php8.c>
        Define PHP_MODE_MODPHP 1
    </IfModule>
</IfDefine>

# --- 4. Diagnostics (optional)
<IfDefine !PHP_MODE_FPM>
    <IfDefine !PHP_MODE_MODPHP>
        # PHP not detected — PHP scripts will not be executed
    </IfDefine>
</IfDefine>
