# ============================================================
# Автоопределение PHP: FPM (unix socket) или mod_php
# Подключать ДО vhost'ов (a2enconf php-autodetect)
# ============================================================

# --- 1. Ищем сокет FPM
<IfFile /run/php/php-fpm.sock>
    Define FPM_SOCKET /run/php/php-fpm.sock
</IfFile>
<IfFile /run/php/php8.3-fpm.sock>
    Define FPM_SOCKET /run/php/php8.3-fpm.sock
</IfFile>

# --- 2. FPM-режим: сокет найден + mod_proxy_fcgi подключён
<IfDefine FPM_SOCKET>
    <IfModule mod_proxy_fcgi.c>
        Define PHP_MODE_FPM 1
    </IfModule>
</IfDefine>

# --- 3. Fallback: mod_php (если FPM не выбран)
<IfDefine !PHP_MODE_FPM>
    <IfModule mod_php.c>
        Define PHP_MODE_MODPHP 1
    </IfModule>
    <IfModule mod_php8.c>
        Define PHP_MODE_MODPHP 1
    </IfModule>
</IfDefine>

# --- 4. Диагностика (опционально)
<IfDefine !PHP_MODE_FPM>
    <IfDefine !PHP_MODE_MODPHP>
        # PHP не обнаружен — PHP-скрипты выполняться не будут
    </IfDefine>
</IfDefine>
