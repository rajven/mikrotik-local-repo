<VirtualHost *:80>
#    ServerName example.org
#    ServerAlias download.mikrotik.com upgrade.mikrotik.com

    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    <Location "/server-status">
        SetHandler server-status
        Require ip 127.0.0.1
    </Location>

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    <Directory "/var/www/html/routeros">
        Options +Indexes
        Require all granted
    </Directory>

    <LocationMatch "^/routeros/">
        Satisfy any
        Require all granted
    </LocationMatch>

    # ============================================================
    # 1. Hidden files and directories
    # ============================================================
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
    <DirectoryMatch "/\.[^/]+">
        Require all denied
    </DirectoryMatch>

    # ============================================================
    # 2. Deny access to databases, backups, and configuration files
    #    inside the project
    # ============================================================
    <Directory "/var/www/html/mt-proxy">
        <FilesMatch "\.(db|sqlite|sqlite3|db-journal|db-wal|db-shm|sql)$">
            Require all denied
        </FilesMatch>
        <FilesMatch "(^\.git|^\.env|^composer\.(json|lock)$|\.log$)">
            Require all denied
        </FilesMatch>
    </Directory>

    # ============================================================
    # 3. /mt-proxy/ — Basic Auth + PHP
    # ============================================================
    <Directory "/var/www/html/mt-proxy">
        AuthType Basic
        AuthName "Restricted Access"
        AuthUserFile /etc/apache2/.htpasswd
        Require valid-user

        DirectoryIndex index.php
        FallbackResource /mt-proxy/index.php

        <IfDefine PHP_MODE_FPM>
            <FilesMatch "\.php$">
                SetHandler "proxy:unix:${FPM_SOCKET}|fcgi://localhost/"
            </FilesMatch>
        </IfDefine>
        <IfDefine PHP_MODE_MODPHP>
            <FilesMatch "\.php$">
                SetHandler application/x-httpd-php
            </FilesMatch>
        </IfDefine>
    </Directory>

    # ============================================================
    # 4. RouterOS v6 — FPM: override SCRIPT_FILENAME
    # ============================================================
    <IfDefine PHP_MODE_FPM>
        <LocationMatch "^/routeros/(NEWEST6\.stable|NEWESTa6\.stable|NEWEST6\.long-term|NEWESTa6\.long-term|NEWEST6\.upgrade|NEWESTa6\.upgrade)$">
            SetHandler "proxy:unix:${FPM_SOCKET}|fcgi://localhost/var/www/html/mt-proxy/ros6-upgrade.php"
        </LocationMatch>

        <LocationMatch "^/routeros/(NEWEST7\.stable|NEWESTa7\.stable|NEWEST7\.long-term|NEWESTa7\.long-term|NEWEST7\.upgrade|NEWESTa7\.upgrade)$">
            SetHandler "proxy:unix:${FPM_SOCKET}|fcgi://localhost/var/www/html/mt-proxy/ros7-upgrade.php"
        </LocationMatch>

        <Location "/routeros/force_update.php">
            SetHandler "proxy:unix:${FPM_SOCKET}|fcgi://localhost/var/www/html/mt-proxy/force_update.php"
        </Location>
    </IfDefine>

    # ============================================================
    # 5. RouterOS v6/v7 — mod_php: override via Alias + Rewrite
    # ============================================================
    <IfDefine PHP_MODE_MODPHP>
        RewriteEngine On

        RewriteRule ^/routeros/(NEWEST6\.stable|NEWESTa6\.stable|NEWEST6\.long-term|NEWESTa6\.long-term|NEWEST6\.upgrade|NEWESTa6\.upgrade)$ \
            /mt-proxy/ros6-upgrade.php [L,QSA]

        RewriteRule ^/routeros/(NEWEST7\.stable|NEWESTa7\.stable|NEWEST7\.long-term|NEWESTa7\.long-term|NEWEST7\.upgrade|NEWESTa7\.upgrade)$ \
            /mt-proxy/ros7-upgrade.php [L,QSA]

        RewriteRule ^/routeros/force_update\.php$ \
            /mt-proxy/force_update.php [L,QSA]
    </IfDefine>

    # ============================================================
    # 6. Disable gzip and Accept-Encoding for binary responses
    # ============================================================
    <IfModule mod_deflate.c>
        SetEnvIf Request_URI "^/routeros/(NEWEST6|NEWESTa6|NEWEST7|NEWESTa7)\.(stable|long-term|upgrade)" no-gzip
        SetEnvIf Request_URI "^/routeros/force_update\.php" no-gzip
    </IfModule>

    <IfModule mod_headers.c>
        SetEnvIf Request_URI "^/routeros/(NEWEST6|NEWESTa6|NEWEST7|NEWESTa7)\.(stable|long-term|upgrade)" NO_ACCEPT_ENCODING
        SetEnvIf Request_URI "^/routeros/force_update\.php" NO_ACCEPT_ENCODING
        RequestHeader unset Accept-Encoding env=NO_ACCEPT_ENCODING
    </IfModule>


</VirtualHost>
