<VirtualHost *:80>
    ServerName upgrade.example.com
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # ============================================================
    # MikroTik upgrade script
    # ============================================================

    RewriteEngine On

    # ------------------------------------------------------------
    # Полный запрет ПРЯМОГО доступа к каталогу mt-proxy/.
    # Условие по THE_REQUEST отсекает внутренние реврайты —
    # они уже имеют THE_REQUEST = оригинальный URL (/routeros/...).
    # ------------------------------------------------------------
    RewriteCond %{THE_REQUEST} \s/+mt-proxy/ [NC]
    RewriteRule ^/mt-proxy/ - [F,L]

    # ------------------------------------------------------------
    # RouterOS 6 -> PHP backend
    # ------------------------------------------------------------
    RewriteRule ^/routeros/(NEWEST6\.stable|NEWESTa6\.stable|NEWEST6\.long-term|NEWESTa6\.long-term|NEWEST6\.upgrade|NEWESTa6\.upgrade)$ /mt-proxy/ros6-upgrade.php [END]

    # ------------------------------------------------------------
    # RouterOS 7 -> PHP backend
    # ------------------------------------------------------------
    RewriteRule ^/routeros/(NEWEST7\.stable|NEWESTa7\.stable|NEWEST7\.long-term|NEWESTa7\.long-term|NEWEST7\.upgrade|NEWESTa7\.upgrade)$ /mt-proxy/ros7-upgrade.php [END]

    # ------------------------------------------------------------
    # Update enabled?
    # ------------------------------------------------------------
    RewriteRule ^/routeros/force_update\.php$ /mt-proxy/force_update.php [END]

    # ------------------------------------------------------------
    # Disable gzip compression for these URLs
    # ------------------------------------------------------------
    <IfModule mod_deflate.c>
        SetEnvIf Request_URI "^/routeros/(NEWEST6|NEWESTa6|NEWEST7|NEWESTa7)\.(stable|long-term|upgrade)" no-gzip dont-vary
        SetEnvIf Request_URI "^/routeros/force_update\.php" no-gzip dont-vary
    </IfModule>

    # ------------------------------------------------------------
    # Remove Accept-Encoding from incoming requests
    # ------------------------------------------------------------
    <IfModule mod_headers.c>
        SetEnvIf Request_URI "^/routeros/(NEWEST6|NEWESTa6|NEWEST7|NEWESTa7)\.(stable|long-term|upgrade)" NO_ACCEPT_ENCODING
        SetEnvIf Request_URI "^/routeros/force_update\.php" NO_ACCEPT_ENCODING
        RequestHeader unset Accept-Encoding env=NO_ACCEPT_ENCODING
    </IfModule>

</VirtualHost>
