# mikrotik-local-repo container vhost (lighttpd 1.4.x)
#
# Standalone config: it is installed by the entrypoint as
# /etc/lighttpd/lighttpd.conf and replaces Debian's default one entirely
# (the only include is Debian's mime table). Behavioral parity with the
# previous nginx vhost:
#   - /healthz                        -> static file, access log off
#   - dotfiles                        -> 403
#   - state/cache extensions          -> 404 (existence must not leak;
#                                        nginx used `deny all; return 404`)
#   - /routeros/*.(rsc|txt)           -> RouterOS User-Agents only (403)
#   - /mt-proxy/                      -> Basic Auth + PHP via php-fpm socket
#   - /routeros/NEWEST*.stable/…      -> ros6/ros7-upgrade.php (unauth, device-
#                                        facing; REQUEST_URI stays the device-
#                                        facing URL, the PHP routes on it)
#   - /routeros/force_update.php      -> mt-proxy/force_update.php
#   - /routeros/ros-warmup.php        -> mt-proxy/ros-warmup.php
#   - everything else under /routeros -> static files, directory listing on
#
# Difference against nginx (deliberate): `/mt-proxy` (no trailing slash) no
# longer falls through to an unauthenticated directory listing of the admin
# UI directory — the auth condition covers both /mt-proxy and /mt-proxy/…

server.modules = (
    "mod_access",
    "mod_alias",
    "mod_rewrite",
    "mod_auth",
    "mod_authn_file",
    "mod_indexfile",
    "mod_dirlisting",
    "mod_fastcgi",
    "mod_accesslog",
)

server.port          = 80
server.bind          = "0.0.0.0"
server.document-root = "/var/www/html"
server.username      = "www-data"
server.groupname     = "www-data"
server.pid-file      = "/run/lighttpd.pid"
server.errorlog      = "/dev/stderr"
accesslog.filename   = "/dev/stdout"

# Debian's MIME table is generated by the helper shipped with the package.
include_shell "/usr/share/lighttpd/create-mime.conf.pl"

# nginx served `index index.html` globally and `index index.php` inside
# /mt-proxy/; no directory in the web root carries both files, so one list
# covers both cases.
index-file.names = ("index.php", "index.html")

# == nginx `autoindex on` (location /); hidden files are not offered.
server.dir-listing        = "enable"
dir-listing.hide-dotfiles = "enable"

# == nginx `limit_rate 50M` (location /). nginx additionally allowed a free
# 100 MB burst (limit_rate_after); lighttpd throttles from the first byte.
$HTTP["url"] =~ "^/routeros/" {
    connection.kbytes-per-second = 51200
}

# == nginx `location = /healthz { access_log off; return 200 "ok\n"; }`
# The file is created by the Dockerfile; only the log is silenced here.
$HTTP["url"] == "/healthz" {
    accesslog.filename = ""
}

# == nginx `location ~ /\.` (dotfiles, incl. .git/.env/.htpasswd anywhere).
$HTTP["url"] =~ "/\." {
    url.access-deny = ("")
}

# State/cache files must never be web-readable wherever they appear.
# nginx answered 404 for these (deny all + return 404), so the existence of
# e.g. the version cache files is not confirmed by the status code: rewrite
# to a path that does not exist instead of a plain 403. Nested under the
# negative dotfile condition so a dotfile keeps nginx's 403.
# (url.rewrite = the once-semantics of nginx's rewrite; lighttpd >= 1.4.56
# renamed the old url.rewrite-once to url.rewrite.)
$HTTP["url"] !~ "/\." {
    $HTTP["url"] =~ "(?i)\.(db|db-journal|db-wal|db-shm|sqlite|sqlite3|sql|log|env|htpasswd|cache|part|new|tmp)$" {
        url.rewrite = ( ".*" => "/__blocked-by-mirror-policy__" )
    }
}

# Device scripts: RouterOS User-Agents only. The User-Agent alternatives are
# case-sensitive here, exactly like the nginx `map` entries were; the path
# part is case-insensitive like the nginx `~*` location was.
$HTTP["url"] =~ "(?i)^/routeros/.*\.(rsc|txt)$" {
    $HTTP["useragent"] !~ "^(Mikrotik/6\..* Fetch|Mikrotik/7\..* Fetch|RouterOS 7\..*\..*|RouterOS 7\..*)$" {
        url.access-deny = ("")
    }
}

# ---------------------------------------------------------------- admin UI
# Basic Auth + PHP. PHP-FPM is unchanged from the nginx setup (same pool, same
# unix socket). NOTE: the condition deliberately also matches `/mt-proxy`
# without the trailing slash — the nginx vhost leaked an unauthenticated
# directory listing there.
# Admin auth backend is selected by include_shell (docker/bin/mt-auth-backend.sh):
# htpasswd file seeded by the entrypoint by default, LDAP lookups when
# MT_LDAP_AUTH=1. The auth.require rules below are backend-agnostic.
include_shell "/opt/docker/bin/mt-auth-backend.sh"

$HTTP["url"] =~ "^/mt-proxy($|/)" {
    server.dir-listing = "disable"
    auth.require = ( "" => ( "method" => "basic",
                             "realm"  => "mikrotik-local-repo admin",
                             "require" => "valid-user" ) )
    fastcgi.server = ( ".php" => (( "socket" => "/run/php-fpm.sock",
                                    "broken-scriptfilename" => "enable" )) )
}

# ------------------------------------------- RouterOS version endpoints
# nginx passed an explicit SCRIPT_FILENAME to php-fpm; here mod_alias maps the
# device-facing URL onto the mt-proxy script and mod_fastcgi with the empty
# extension key claims it. The PHP code routes on REQUEST_URI (unchanged) and
# QUERY_STRING (unchanged) and does not read SCRIPT_NAME.
alias.url = (
    "/routeros/NEWEST6.stable"     => "/var/www/html/mt-proxy/ros6-upgrade.php",
    "/routeros/NEWEST6.long-term"  => "/var/www/html/mt-proxy/ros6-upgrade.php",
    "/routeros/NEWEST6.upgrade"    => "/var/www/html/mt-proxy/ros6-upgrade.php",
    "/routeros/NEWESTa6.stable"    => "/var/www/html/mt-proxy/ros6-upgrade.php",
    "/routeros/NEWESTa6.long-term" => "/var/www/html/mt-proxy/ros6-upgrade.php",
    "/routeros/NEWESTa6.upgrade"   => "/var/www/html/mt-proxy/ros6-upgrade.php",
    "/routeros/NEWEST7.stable"     => "/var/www/html/mt-proxy/ros7-upgrade.php",
    "/routeros/NEWEST7.long-term"  => "/var/www/html/mt-proxy/ros7-upgrade.php",
    "/routeros/NEWEST7.upgrade"    => "/var/www/html/mt-proxy/ros7-upgrade.php",
    "/routeros/NEWESTa7.stable"    => "/var/www/html/mt-proxy/ros7-upgrade.php",
    "/routeros/NEWESTa7.long-term" => "/var/www/html/mt-proxy/ros7-upgrade.php",
    "/routeros/NEWESTa7.upgrade"   => "/var/www/html/mt-proxy/ros7-upgrade.php",
    "/routeros/force_update.php"   => "/var/www/html/mt-proxy/force_update.php",
    "/routeros/ros-warmup.php"     => "/var/www/html/mt-proxy/ros-warmup.php",
)

$HTTP["url"] =~ "^/routeros/NEWEST(6|a6)\.(stable|long-term|upgrade)$" {
    fastcgi.server = ( "" => (( "socket" => "/run/php-fpm.sock",
                                "broken-scriptfilename" => "enable" )) )
}

$HTTP["url"] =~ "^/routeros/NEWEST(7|a7)\.(stable|long-term|upgrade)$" {
    fastcgi.server = ( "" => (( "socket" => "/run/php-fpm.sock",
                                "broken-scriptfilename" => "enable" )) )
}

$HTTP["url"] == "/routeros/force_update.php" {
    fastcgi.server = ( "" => (( "socket" => "/run/php-fpm.sock",
                                "broken-scriptfilename" => "enable" )) )
}

# Warm-up walks the whole device DB and hits upstream per version: slow.
$HTTP["url"] == "/routeros/ros-warmup.php" {
    fastcgi.server = ( "" => (( "socket" => "/run/php-fpm.sock",
                                "broken-scriptfilename" => "enable" )) )
}

# everything else (.npk, all_packages zips, winbox, changelogs) = static
# files under /routeros (symlinked to the /data volume).
