; PHP-FPM pool for the mikrotik-local-repo container.
; Installed as /etc/php/<ver>/fpm/pool.d/container.conf

[www]
user  = www-data
group = www-data

listen = /run/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode  = 0660

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; env: MT_PROXY_DB_PATH (SQLite + WAL live on the /data volume —
; path resolved by the patched db.php; see docker/Dockerfile)
clear_env = no
env[MT_PROXY_DB_PATH] = /data/state/mt_proxy.db

php_admin_value[date.timezone] = UTC
php_admin_value[error_log]      = /dev/stderr
php_admin_flag[log_errors]      = on
php_admin_value[display_errors] = Off

catch_workers_output = yes
decorate_workers_output = no

access.log = /dev/null
