# mikrotik-local-repo container vhost
# http context: conf.d/*.conf is included by Debian's nginx.conf

# Device scripts (*.rsc/*.txt) are served only to RouterOS fetch clients.
map $http_user_agent $allowed_routeros_ua {
    default                      0;
    "~^Mikrotik/6\..* Fetch$"    1;
    "~^Mikrotik/7\..* Fetch$"    1;
    "~^RouterOS 7\..*\..*$"      1;
    "~^RouterOS 7\..*$"          1;
}

server {
    listen 80 default_server;
    server_name _;              # devices resolve mikrotik names to our IP; Host doesn't matter

    root  /var/www/html;
    index index.html;

    access_log /dev/stdout;
    error_log  /dev/stderr;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # State/cache files must never be web-readable wherever they appear.
    location ~* \.(db|db-journal|db-wal|db-shm|sqlite|sqlite3|sql|log|env|htpasswd|cache|part|new|tmp)$ {
        deny all;
        return 404;
    }

    # Device scripts: RouterOS User-Agents only.
    location ~* ^/routeros/.*\.(rsc|txt)$ {
        if ($allowed_routeros_ua = 0) {
            return 403;
        }
    }

    # ------------------------------------------------------------ admin UI
    location /mt-proxy/ {
        auth_basic           "mikrotik-local-repo admin";
        auth_basic_user_file /data/config/.htpasswd;

        index index.php;
        try_files $uri $uri/ /mt-proxy/index.php?$query_string;

        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/run/php-fpm.sock;
            fastcgi_param REMOTE_ADDR $remote_addr;
            fastcgi_read_timeout 300;
        }
    }

    # ------------------------------------------- RouterOS version endpoints
    location ~ ^/routeros/NEWEST(6|a6)\.(stable|long-term|upgrade)$ {
        include /etc/nginx/snippets/mt-fastcgi.conf;
        fastcgi_param SCRIPT_FILENAME /var/www/html/mt-proxy/ros6-upgrade.php;
        fastcgi_param SCRIPT_NAME     /ros6-upgrade.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/html;
        fastcgi_param REQUEST_URI     $request_uri;
        fastcgi_param QUERY_STRING    $query_string;
        fastcgi_read_timeout 5;
    }

    location ~ ^/routeros/NEWEST(7|a7)\.(stable|long-term|upgrade)$ {
        include /etc/nginx/snippets/mt-fastcgi.conf;
        fastcgi_param SCRIPT_FILENAME /var/www/html/mt-proxy/ros7-upgrade.php;
        fastcgi_param SCRIPT_NAME     /ros7-upgrade.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/html;
        fastcgi_param REQUEST_URI     $request_uri;
        fastcgi_param QUERY_STRING    $query_string;
        fastcgi_read_timeout 5;
    }

    # ------------------------------------------------------- policy + warmup
    location = /routeros/force_update.php {
        include /etc/nginx/snippets/mt-fastcgi.conf;
        fastcgi_param SCRIPT_FILENAME /var/www/html/mt-proxy/force_update.php;
        fastcgi_param SCRIPT_NAME     /force_update.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/html;
        fastcgi_param REQUEST_URI     $request_uri;
        fastcgi_param QUERY_STRING    $query_string;
        fastcgi_read_timeout 5;
    }

    # Warm-up walks the whole device DB and hits upstream per version: slow.
    location = /routeros/ros-warmup.php {
        include /etc/nginx/snippets/mt-fastcgi.conf;
        fastcgi_param SCRIPT_FILENAME /var/www/html/mt-proxy/ros-warmup.php;
        fastcgi_param SCRIPT_NAME     /ros-warmup.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/html;
        fastcgi_param REQUEST_URI     $request_uri;
        fastcgi_param QUERY_STRING    $query_string;
        fastcgi_read_timeout 3600;
    }

    # everything else (.npk, all_packages zips, winbox, changelogs) = static
    # files under /routeros (symlinked to the /data volume).

    location / {
        limit_rate_after 100m;
        limit_rate       50M;
        autoindex on;
    }

}
